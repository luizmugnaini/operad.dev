base_url = "https://operad.dev"
title = "operad.dev"
description = "Notes on mathematics & programming — Luiz Mugnaini."
default_language = "en"

# Compile Sass from sass/ to public/.
compile_sass = true

# RSS / Atom feeds.
generate_feeds = true
feed_filenames = ["atom.xml"]

# No JS-based search; tags + the archive page are enough at this scale.
build_search_index = false

taxonomies = [
    { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true

[markdown.highlighting]
theme = "tokyo-night"

[extra]
author = "Luiz Mugnaini"
wordmark = "operad.dev"
tagline = "Notes on mathematics & programming."

# Favicon — reused as the inline wordmark icon in the top bar.
favicon = "/favicon_knot-192x192.png"
favicon_mimetype = "image/png"

# Top-level navigation.
# - Internal paths begin with `/` and are resolved against base_url at render time.
# - External links are flagged with `external = true` (open in a new tab).
menu = [
    { name = "notes", url = "/" },
    { name = "about", url = "/about" },
    { name = "links", url = "/links" },
    { name = "cv",    url = "/cv" },
    { name = "code",  url = "https://git.sr.ht/~luizmugnaini", external = true },
]