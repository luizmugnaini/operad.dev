{# math shortcode — display math with optional caption. The figure body is
   kept on adjacent lines so CommonMark treats the whole thing as one HTML
   block; otherwise the $$..$$ inside would be wrapped in a <p>. #}
<figure class="figure figure--math">
<span class="math-display">$${{ body | trim | safe }}$$</span>
{%- if caption %}
<figcaption class="figure__caption">{{ caption | markdown(inline=true) | safe }}</figcaption>
{%- endif %}
</figure>
